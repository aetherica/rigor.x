name: RIGOR-X Pipeline

on:
  push:
    branches: [main]
    paths:
      - "src/rigorx/**"
      - "tests/**"
      - "pyproject.toml"
      - "schemas/**"
      - ".github/workflows/rigorx-pipeline.yml"
      - "README.md"
      - "docs/**"
      - "engineering/ai-system/**"
  pull_request:
    branches: [main]
    paths:
      - "src/rigorx/**"
      - "tests/**"
      - "pyproject.toml"
      - "schemas/**"
      - ".github/workflows/rigorx-pipeline.yml"
      - "README.md"
      - "docs/**"
      - "engineering/ai-system/**"
  workflow_dispatch:

concurrency:
  group: rigorx-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline-contract-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tools
        run: python -m pip install '.[test]' ruff build
      - name: Ruff static analysis
        run: ruff check src tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          rigorx-version
          rigorx-agent --help
