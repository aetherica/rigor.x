name: RIGOR-X Pipeline

on:
  push:
    branches: [main]
    paths:
      - "src/rigorx/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/rigorx-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/rigorx/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/rigorx-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Run pipeline contract tests
        run: python -m unittest discover -s tests -v
