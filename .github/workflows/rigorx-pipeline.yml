name: RIGOR-X Pipeline

on:
  push:
    branches: [main]
    paths:
      - "src/rigorx/**"
      - "tests/**"
      - "pyproject.toml"
      - "schemas/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "PUBLIC-RELEASE-CHECKLIST.md"
      - "PUBLIC-REVIEW.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "engineering/ai-system/**"
      - "library/slash-commands/**"
      - "examples/**"
      - "deploy/**"
  pull_request:
    branches: [main]
    paths:
      - "src/rigorx/**"
      - "tests/**"
      - "pyproject.toml"
      - "schemas/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "PUBLIC-RELEASE-CHECKLIST.md"
      - "PUBLIC-REVIEW.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "engineering/ai-system/**"
      - "library/slash-commands/**"
      - "examples/**"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: rigorx-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline-contract-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tools
        run: python -m pip install '.[test]' 'ruff==0.16.9' build
      - name: Ruff static analysis
        run: ruff check src tests examples deploy
      - name: Run test suite (core, without optional MCP SDK)
        run: python -m unittest discover -s tests -v
      - name: Install optional MCP SDK
        run: python -m pip install '.[test,mcp]'
      - name: Run test suite (with MCP SDK)
        run: python -m unittest discover -s tests -v
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          rigorx-version
          rigorx-agent --help
          rigorx-mcp --help

  cloudflare-worker-ts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install package with the MCP SDK (conformance client)
        run: python -m pip install '.[mcp]'
      - name: TypeScript unit and parity tests (no npm dependencies)
        working-directory: deploy/cloudflare-ts
        run: npm test
      - name: Parity fixtures still match the Python engine
        run: PYTHONPATH=src python deploy/cloudflare-ts/scripts/parity_fixtures.py --check
      - name: Conformance with the official MCP SDK client
        run: |
          node --no-warnings --experimental-strip-types deploy/cloudflare-ts/scripts/dev-server.ts 8787 ci-token &
          sleep 3
          python examples/mcp_smoke.py --url http://127.0.0.1:8787/mcp --token ci-token
