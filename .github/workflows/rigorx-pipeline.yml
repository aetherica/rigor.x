name: RIGOR-X Pipeline

on:
  push:
    branches: [main]
    paths:
      - "src/rigorx/**"
      - "tests/**"
      - "pyproject.toml"
      - "schemas/**"
      - ".github/workflows/rigorx-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/rigorx/**"
      - "tests/**"
      - "pyproject.toml"
      - "schemas/**"
      - ".github/workflows/rigorx-pipeline.yml"
  workflow_dispatch:

concurrency:
  group: rigorx-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline-contract-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install '.[test]' ruff
      - name: Ruff static analysis
        run: ruff check src tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Package CLI smoke
        run: rigorx-version
