name: RIGOR-X Pipeline

on:
  push:
    branches: [main]
    paths:
      - "src/rigorx/**"
      - "tests/**"
      - "pyproject.toml"
      - "schemas/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "PUBLIC-RELEASE-CHECKLIST.md"
      - "PUBLIC-REVIEW.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "engineering/ai-system/**"
      - "library/slash-commands/**"
      - "library/rigorx-commands/**"
      - "examples/**"
      - "deploy/**"
  pull_request:
    branches: [main]
    paths:
      - "src/rigorx/**"
      - "tests/**"
      - "pyproject.toml"
      - "schemas/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "PUBLIC-RELEASE-CHECKLIST.md"
      - "PUBLIC-REVIEW.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "engineering/ai-system/**"
      - "library/slash-commands/**"
      - "library/rigorx-commands/**"
      - "examples/**"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: rigorx-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline-contract-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tools
        run: python -m pip install '.[test]' 'ruff==0.16.9' build
      - name: Ruff static analysis
        run: ruff check src tests examples deploy
      - name: Run test suite (core, without optional MCP SDK)
        run: python -m unittest discover -s tests -v
      - name: Install optional MCP SDK
        run: python -m pip install '.[test,mcp]'
      - name: Run test suite (with MCP SDK)
        run: python -m unittest discover -s tests -v
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          rigorx-version
          rigorx-agent --help
          rigorx-mcp --help

  cloudflare-worker-ts:
    runs-on: ubuntu-latest
    services:
      # Disposable PostgreSQL for the Node runtime's PostgreSQL storage tests (no credentials of any real system).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install package with the MCP SDK (conformance client)
        run: python -m pip install '.[mcp]'
      - name: Install Worker dependencies (locked)
        working-directory: deploy/cloudflare-ts
        run: npm ci --no-audit --no-fund
      - name: Audit production dependency tree
        working-directory: deploy/cloudflare-ts
        run: npm audit --omit=dev --audit-level=high
      - name: Type check (tsc --strict, Workers and Node types)
        working-directory: deploy/cloudflare-ts
        run: npm run typecheck
      - name: TypeScript unit and parity tests
        working-directory: deploy/cloudflare-ts
        run: npm test
      - name: Mutation test of security guards (each disabled guard must fail the suite)
        working-directory: deploy/cloudflare-ts
        run: python3 scripts/mutation_test.py
      - name: Owner-authored command set is valid and separate from the 999-entry corpus
        run: python library/rigorx-commands/scripts/validate_rigorx_commands.py
      - name: Bundled slash-command catalogue matches the library
        run: python deploy/cloudflare-ts/scripts/build_commands.py --check
      - name: rigorx_compute against an independent units library (pint, CODATA 2022)
        run: |
          python -m pip install 'pint==0.26.2'
          python deploy/cloudflare-ts/scripts/compute_differential.py
      - name: Real Worker auth path under wrangler dev (OAuth only; static token rejected)
        working-directory: deploy/cloudflare-ts
        run: node test/integration/auth-probe.mjs
      - name: Durable Object storage on workerd (migrations, quotas, listing, rows written)
        working-directory: deploy/cloudflare-ts
        run: node test/integration/run.mjs
      - name: Conformance with the official MCP SDK client (auto, handshake and stateless eras)
        run: |
          node --no-warnings --experimental-strip-types deploy/cloudflare-ts/scripts/dev-server.ts 8787 ci-token &
          sleep 3
          python examples/mcp_smoke.py --url http://127.0.0.1:8787/mcp --token ci-token --mode auto --expect-version 2026-07-28
          python examples/mcp_smoke.py --url http://127.0.0.1:8787/mcp --token ci-token --mode legacy --expect-version 2025-11-25
          python examples/mcp_smoke.py --url http://127.0.0.1:8787/mcp --token ci-token --mode 2026-07-28 --expect-version 2026-07-28
      - name: "Portable Node runtime: install its locked dependencies (PostgreSQL driver) and audit them"
        working-directory: deploy/node
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: "Portable Node runtime: KV TTL, owner isolation, OAuth with real tokens, MCP, SSRF guard, shutdown, PostgreSQL storage (CAS, deletion race, TLS, privileges, migrations)"
        env:
          RIGORX_NET_TESTS: "1"
          PG_TEST_URL: postgres://postgres:ci-local-only@127.0.0.1:5432/postgres
        run: node --import ./deploy/node/register.mjs --experimental-strip-types --disable-warning=ExperimentalWarning --test --test-timeout=120000 deploy/node/test/*.test.ts
      - name: "Portable Node runtime: the Worker's auth probe, unchanged, against node:http"
        working-directory: deploy/cloudflare-ts
        run: node test/integration/auth-probe.mjs --node
      - name: "Portable Node runtime: official MCP SDK client with a real OAuth token (three protocol modes)"
        run: |
          TOKEN_FILE="$RUNNER_TEMP/node-token"
          node --import ./deploy/node/register.mjs --experimental-strip-types --disable-warning=ExperimentalWarning deploy/node/test/sdk-smoke-server.ts 8797 "$TOKEN_FILE" &
          for i in $(seq 50); do [ -s "$TOKEN_FILE" ] && break; sleep 0.2; done
          python examples/mcp_smoke.py --url http://127.0.0.1:8797/mcp --token "$(cat "$TOKEN_FILE")" --mode auto --expect-version 2026-07-28
          python examples/mcp_smoke.py --url http://127.0.0.1:8797/mcp --token "$(cat "$TOKEN_FILE")" --mode legacy --expect-version 2025-11-25
          python examples/mcp_smoke.py --url http://127.0.0.1:8797/mcp --token "$(cat "$TOKEN_FILE")" --mode 2026-07-28 --expect-version 2026-07-28
          kill %1
      - name: "Portable Node runtime: container builds, starts as non-root, answers health and 401, stops cleanly"
        run: |
          docker build -f deploy/node/Dockerfile -t aetherica-node:ci .
          docker run -d --name aeth -p 8790:8787 -e PUBLIC_ORIGIN=http://localhost:8790 -e GOOGLE_CLIENT_ID=ci-client -e GOOGLE_CLIENT_SECRET=ci-not-a-secret aetherica-node:ci
          for i in $(seq 60); do curl -fsS http://localhost:8790/health >/dev/null && break; sleep 0.5; done
          curl -fsS http://localhost:8790/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8790/mcp -H 'content-type: application/json' -d '{}')" = 401
          test "$(docker exec aeth id -un)" = node
          docker stop -t 15 aeth
          test "$(docker inspect aeth --format '{{.State.ExitCode}}')" = 0
          docker logs aeth 2>&1 | grep '"phase":"complete"'
      - name: "Portable Node runtime: container with PostgreSQL storage (explicit migration, fail-closed start, health, 401, clean stop)"
        run: |
          DB=postgres://postgres:ci-local-only@127.0.0.1:5432/postgres
          RUN="docker run --rm --network host -e NODE_ENV=development -e DATABASE_SSL=disable -e DATABASE_URL=$DB"
          # Before migrating, the server must refuse to start (exit 78).
          set +e; $RUN -e PORT=8793 -e PUBLIC_ORIGIN=http://127.0.0.1:8793 -e STORAGE=postgres -e OWNER_KEY_SECRET=ci-owner-key-secret-0123456789abcdefghij -e GOOGLE_CLIENT_ID=ci -e GOOGLE_CLIENT_SECRET=ci-not-a-secret aetherica-node:ci; code=$?; set -e
          test "$code" = 78
          $RUN aetherica-node:ci node --import ./deploy/node/register.mjs --experimental-strip-types --disable-warning=ExperimentalWarning deploy/node/migrate.ts
          docker run -d --name aeth-pg --network host -e NODE_ENV=development -e DATABASE_SSL=disable -e DATABASE_URL=$DB -e PORT=8792 -e PUBLIC_ORIGIN=http://127.0.0.1:8792 -e STORAGE=postgres -e OWNER_KEY_SECRET=ci-owner-key-secret-0123456789abcdefghij -e GOOGLE_CLIENT_ID=ci -e GOOGLE_CLIENT_SECRET=ci-not-a-secret aetherica-node:ci
          for i in $(seq 60); do curl -fsS http://127.0.0.1:8792/health >/dev/null && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8792/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8792/mcp -H 'content-type: application/json' -d '{}')" = 401
          docker logs aeth-pg 2>&1 | grep '"storage":{"kind":"postgres"'
          docker stop -t 15 aeth-pg
          test "$(docker inspect aeth-pg --format '{{.State.ExitCode}}')" = 0
