name: Front door deploy
# Deploys only the x.aetherica.workers.dev front door (Worker "x"); the core Worker is untouched.
on:
  push:
    branches: [main]
    paths: ["deploy/x-front/**", ".github/workflows/front-door-deploy.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: cloudflare-production-release, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Deploy front door
        working-directory: deploy/x-front
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.114.0 deploy --config wrangler.jsonc --tag "${GITHUB_SHA:0:12}" --message "front door ${{ github.sha }}"
      - name: Smoke test
        run: |
          set -euo pipefail
          BASE=https://x.aetherica.workers.dev
          for path in /health /.well-known/oauth-authorization-server; do
            code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$BASE$path")"; echo "$path => $code"; test "$code" -ge 200 && test "$code" -lt 400
          done
          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST "$BASE/mcp" -H 'content-type: application/json' --data '{}')"; echo "/mcp => $code (401 expected)"; test "$code" = 401
