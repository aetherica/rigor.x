name: Slash Command Library Validation

on:
  push:
    branches: [main]
    paths:
      - "library/slash-commands/**"
      - ".github/workflows/slash-command-library.yml"
  pull_request:
    branches: [main]
    paths:
      - "library/slash-commands/**"
      - ".github/workflows/slash-command-library.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up stable Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          check-latest: true
      - name: Install schema validator
        run: python -m pip install --upgrade jsonschema
      - name: Validate library
        working-directory: library/slash-commands
        run: python scripts/validate_slash_command_library.py
