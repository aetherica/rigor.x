name: Slash Command Library Validation

on:
  push:
    branches: [main]
    paths:
      - "library/slash-commands/**"
      - ".github/workflows/slash-command-library.yml"
  pull_request:
    branches: [main]
    paths:
      - "library/slash-commands/**"
      - ".github/workflows/slash-command-library.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slash-library-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.25,<5"
      - name: Validate library
        working-directory: library/slash-commands
        run: python scripts/validate_slash_command_library.py
