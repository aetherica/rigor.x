name: Cloudflare Production Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Verify and test
        run: |
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          test -z "$(git status --porcelain)"
          cd deploy/cloudflare-ts
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Deploy core Worker first
        working-directory: deploy/cloudflare-ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_CI_BRANCH: main
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/deploy.mjs
      - name: Deploy front door
        working-directory: deploy/x-front
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.114.0 deploy --config wrangler.jsonc --message "main ${{ github.sha }}"
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify public endpoints
        env:
          BASE: https://x.aetherica.workers.dev
        run: |
          set -euo pipefail
          for path in /health /version /.well-known/oauth-authorization-server /.well-known/oauth-protected-resource; do
            code="$(curl -sS --max-time 30 -o /tmp/response -w '%{http_code}' "$BASE$path")"
            echo "$path => $code"; test "$code" -ge 200 && test "$code" -lt 400
          done
          code="$(curl -sS --max-time 30 -o /tmp/mcp -w '%{http_code}' -X POST "$BASE/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"release-smoke","version":"1"}}}')"
          echo "MCP initialize => $code"; test "$code" -ge 200 && test "$code" -lt 400
