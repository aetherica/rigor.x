name: Browser Core
on:
  push:
    paths:
      - "browser/**"
      - ".github/workflows/browser-core.yml"
  pull_request:
    paths:
      - "browser/**"
      - ".github/workflows/browser-core.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Test browser core and GeckoDriver adapter
        run: node --no-warnings --experimental-strip-types --test browser/core/*.test.ts browser/geckodriver/*.test.ts
