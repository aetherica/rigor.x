name: Browser Core
on:
  push:
    paths:
      - "browser/**"
      - ".github/workflows/browser-core.yml"
  pull_request:
    paths:
      - "browser/**"
      - ".github/workflows/browser-core.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install temporary type-check dependencies
        run: npm install --no-save typescript@5.9.3 @types/node
      - name: Type-check browser implementation
        run: npx tsc -p browser/tsconfig.json
      - name: Test browser core and GeckoDriver adapter
        run: node --no-warnings --experimental-strip-types --test browser/core/*.test.ts browser/geckodriver/*.test.ts browser/*.test.ts
