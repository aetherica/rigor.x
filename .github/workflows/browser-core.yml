name: Browser Core
on:
  push:
    paths:
      - "browser/**"
      - ".github/workflows/browser-core.yml"
  pull_request:
    paths:
      - "browser/**"
      - ".github/workflows/browser-core.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install temporary type-check dependencies
        run: npm install --no-save typescript@5.9.3 @types/node@22
      - name: Type-check browser implementation
        run: npx tsc -p browser/tsconfig.json
      - name: Check Termux installer syntax
        run: bash -n browser/install-termux.sh
      - name: Test Browser Core, GeckoDriver and hosted provider adapters
        run: node --no-warnings --experimental-strip-types --test browser/core/*.test.ts browser/geckodriver/*.test.ts browser/providers/*.test.ts browser/routing/*.test.ts browser/*.test.ts
