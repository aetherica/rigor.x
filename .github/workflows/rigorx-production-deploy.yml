name: RIGOR-X Production Deploy

on:
  push:
    branches: [main]
    paths:
      - "deploy/cloudflare-ts/**"
      - ".github/workflows/rigorx-production-deploy.yml"
  workflow_dispatch:

concurrency:
  group: rigorx-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked Worker dependencies
        working-directory: deploy/cloudflare-ts
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        working-directory: deploy/cloudflare-ts
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        working-directory: deploy/cloudflare-ts
        run: npm run typecheck
      - name: Unit and parity tests
        working-directory: deploy/cloudflare-ts
        run: npm test
      - name: Validate generated command catalogue
        run: python deploy/cloudflare-ts/scripts/build_commands.py --check
      - name: Validate Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository/environment secret CLOUDFLARE_API_TOKEN. Production deploy was not attempted."
            exit 1
          fi
      - name: Deploy exact main commit
        working-directory: deploy/cloudflare-ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f131217adac1edb02444dfcedbb72b55
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
          WORKERS_CI_BRANCH: ${{ github.ref_name }}
        run: npm run deploy
