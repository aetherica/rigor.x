name: Bug report
description: Report a reproducible defect in RIGOR-X
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, personal data, or private vulnerability details. Report security issues privately via SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failed or behaved unexpectedly?
      placeholder: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps and sanitized input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, commit SHA, and relevant configuration (without secrets).
    validations:
      required: true
