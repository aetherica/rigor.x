[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rigor-x-core"
version = "0.1.0"
description = "Deterministic control-plane primitives for the RIGOR-X intelligence pipeline"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
