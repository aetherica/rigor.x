[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rigor-x-core"
version = "0.4.0.dev0"
description = "RIGOR-X deterministic control plane and live model/tool orchestration core"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.25"]

[project.scripts]
rigorx-version = "rigorx.version_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
rigorx-version = "rigorx.version_cli:main"

[tool.ruff]
target-version = "py313"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
